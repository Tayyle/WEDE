<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Menu - Patty Palace</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Open+Sans&display=swap" rel="stylesheet">
  <style>
    body { font-family:'Open Sans', sans-serif; background:#fff8f0; margin:0; }
    h1 { font-family:'Montserrat', sans-serif; color:#FFA500; }
    header { background:#8B4513; padding:10px; text-align:center; }
    nav { background:#FFA500; text-align:center; padding:5px; }
    nav a { color:white; margin:10px; text-decoration:none; }
    .menu { width:400px; margin:20px auto; }
    /* .item,.item img, .item span are css classes that find the elements and tell them how they should look */
    .item { margin:15px 0; text-align:center; }
    .item img { width:100%; max-width:300px; border:2px solid #8B4513; }
    .item h3 { font-family:'Montserrat', sans-serif; margin:10px 0 5px; }
    .item span { display:block; font-weight:bold; color:#8B4513; }
  </style>
</head>
<body>
  <header><h1>Our Menu</h1></header>
  <nav>
    <a href="index.html">Home</a>
    <a href="menu.html">Menu</a>
    <a href="contact.html">Contact</a>
  </nav>
  <div class="menu">
    <div class="item">
      <img src="images/Classic Beef Burger.jpg" alt="Classic Beef Burger">
      <h3>Classic Beef Burger</h3>
      <span>R89.00</span>
    </div>
    <div class="item">
      <img src="images/Chesse burger.jpg" alt="Cheese Lover’s Burger">
      <h3>Cheese Lover’s Burger</h3>
      <span>R99.00</span>
    </div>
    <div class="item">
      <img src="images/BBQ Bacon burger.jpg" alt="BBQ Bacon Burger">
      <h3>BBQ Bacon Burger</h3>
      <span>R109.00</span>
    </div>
    <div class="item">
      <img src="images/Veggie Delight Burger.jpg" alt="Veggie Delight Burger">
      <h3>Veggie Delight Burger</h3>
      <span>R79.00</span>
    </div>
    <div class="item">
      <img src="images/Spicy Jalapeno Burger.jpg" alt="Spicy Jalapeño Burger">
      <h3>Spicy Jalapeño Burger</h3>
      <span>R95.00</span>
    </div>
  </div>
</body>
</html>
